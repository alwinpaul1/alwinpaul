name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-metrics.yml"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    # Each card is rendered once per site theme. The palettes mirror the site's
    # light and dark tokens in src/styles/global.css; keep them in step.
    env:
      DARK_CSS: |
        svg {
          background: #111827;
          color: #9ca3af;
        }
        h1, h2, h3 {
          color: #60a5fa;
        }
        a, .blue {
          color: #60a5fa;
        }
        .field svg {
          fill: #60a5fa;
        }
        .field.language.details small,
        footer {
          color: #9ca3af;
        }
        .label {
          background-color: rgba(96, 165, 250, 0.16);
          color: #60a5fa;
        }
        code,
        span.code {
          background-color: rgba(156, 163, 175, 0.12);
          color: #f3f4f6;
        }
        :root {
          --color-calendar-graph-day-bg: #1f2937;
          --color-calendar-graph-day-L1-bg: #1e3a8a;
          --color-calendar-graph-day-L2-bg: #1d4ed8;
          --color-calendar-graph-day-L3-bg: #3b82f6;
          --color-calendar-graph-day-L4-bg: #93c5fd;
        }
      LIGHT_CSS: |
        svg {
          background: #ffffff;
          color: #4b5563;
        }
        h1, h2, h3 {
          color: #2563eb;
        }
        a, .blue {
          color: #2563eb;
        }
        .field svg {
          fill: #2563eb;
        }
        .field.language.details small,
        footer {
          color: #6b7280;
        }
        .label {
          background-color: rgba(37, 99, 235, 0.1);
          color: #2563eb;
        }
        code,
        span.code {
          background-color: rgba(107, 114, 128, 0.12);
          color: #111827;
        }
        :root {
          --color-calendar-graph-day-bg: #f3f4f6;
          --color-calendar-graph-day-L1-bg: #bfdbfe;
          --color-calendar-graph-day-L2-bg: #60a5fa;
          --color-calendar-graph-day-L3-bg: #2563eb;
          --color-calendar-graph-day-L4-bg: #1e40af;
        }
    steps:
      # For public portfolio cards, github.token is enough. Add a METRICS_TOKEN secret
      # if you later want higher API quotas or private data in these SVGs.
      - name: Generate GitHub stats card (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: alwinpaul1
          template: classic
          filename: public/github/github-metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update github metrics [skip ci]"
          config_timezone: Europe/Berlin
          base: header, activity
          base_indepth: no
          extras_css: ${{ env.DARK_CSS }}

      - name: Generate GitHub stats card (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: alwinpaul1
          template: classic
          filename: public/github/github-metrics-light.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update github metrics [skip ci]"
          config_timezone: Europe/Berlin
          base: header, activity
          base_indepth: no
          extras_css: ${{ env.LIGHT_CSS }}

      - name: Generate top languages card (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: alwinpaul1
          template: classic
          filename: public/github/github-languages.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update github metrics [skip ci]"
          config_timezone: Europe/Berlin
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_indepth: no
          plugin_languages_other: yes
          extras_css: ${{ env.DARK_CSS }}

      - name: Generate top languages card (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          committer_token: ${{ github.token }}
          user: alwinpaul1
          template: classic
          filename: public/github/github-languages-light.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update github metrics [skip ci]"
          config_timezone: Europe/Berlin
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github
          plugin_languages_indepth: no
          plugin_languages_other: yes
          extras_css: ${{ env.LIGHT_CSS }}
